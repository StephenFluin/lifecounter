
<style>
  :host {
    display: block;
    height: 100dvh;
  }
</style>

<div class="game-container">
  <div class="top-row">
    @for (p of topArray(); track p) {
      <app-counter [upsideDown]="true"></app-counter>
    }
  </div>
  <div class="bottom-row">
    @for (p of bottomArray(); track p) {
      <app-counter></app-counter>
    }
  </div>

  <app-settings-menu (changePlayerCount)="changePlayerCount($event)" (reset)="reset()" (setAllLives)="setAllLives($event)"></app-settings-menu>
